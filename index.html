<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morse-Translator</title>
    <link rel = "stylesheet" href = "styles.css">
</head>
<body class = "app">
    <div class = "translator">
    <h1 class = "translator__title">Morse Code Translator</h1>
    <div class = "translator__input-group">
    <input id = "input" class = "translator__input" placeholder="Enter a word or Morse ">
    <button id = "translate" class = "translator__button">Translate</button>
    </div>
    <p id = "error" class = " translator__error"></p>
    <p class = "translator__output-label"><strong>Output: </strong></p>
    <div id = "output" class = "translator__output"></div>
    </div>
    <script type = "module" src = "src/app.js"></script>
</body>
</html>
