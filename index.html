<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morse-Translator</title>
</head>
<body>
    <h1>Morse Code Translator</h1>
    <input id = "englishInput" placeholder="Enter a word (Hello)">
    <button onclick="runTranslate()">Translate</button>
    <p><strong>Output: </strong> <span id = "output"></span></p>
    <script src = "translator.js"></script>
    <script>
        function runTranslate(){
            const input = document.getElementById("englishInput").value;
            const result = translateSentence(input);
            document.getElementById("output").textContent = result;
        }
        
    </script>
</body>
</html>
