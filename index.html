<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morse-Translator</title>
    <link rel = "stylesheet" href = "styles.css">
</head>
<body class = "app">
    <div class = "translator">
    <h1 class = "translator__title">Morse Code Translator</h1>
    <div class = "translator__input-group">
    <input id = "englishInput" class = "translator__input" placeholder="Enter a word or Morse ">
    <button class = "translator__button" onclick="runTranslate()">Translate</button>
    </div>
    <p class = "translator__output-label"><strong>Output: </strong></p>
    <div id = "output" class = "translator__output"></div>
    </div>
    <script src = "translator.js"></script>
    <script>
        function runTranslate(){
            const input = document.getElementById("englishInput").value;
            const result = translateSentence(input);
            document.getElementById("output").textContent = result;
        }
        
    </script>
</body>
</html>
